<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101612">
  <meta name="description" content="Last Stand: Zombie Apocalypse — first-person survival game built with Rust.">
  <title>LAST STAND — Zombie Apocalypse</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101612;color:#e8e8dc;font-family:system-ui,sans-serif;touch-action:none}
    body{display:flex;align-items:center;justify-content:center}canvas{width:100vw;height:100vh;display:block;outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#101612;z-index:2}
    #loading h1{letter-spacing:.14em;font-size:clamp(24px,5vw,48px);margin:0;color:#d8d6bd}
    #loading p{color:#a6aa9b}#bar{height:4px;background:#353d33;margin:18px auto;width:min(260px,70vw);overflow:hidden}#bar:after{content:"";display:block;height:100%;width:35%;background:#b5a36b;animation:load 1.2s infinite ease-in-out}
    @keyframes load{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
  </style>
</head>
<body>
  <div id="loading"><h1>LAST STAND</h1><p>Entering the quarantine zone…</p><div id="bar"></div></div>
  <canvas id="glcanvas" tabindex="0"></canvas>
  <script src="https://not-fl3.github.io/macroquad-js/mq_js_bundle.js"></script>
  <script>
    load("last_stand_rust.wasm");
    document.getElementById("glcanvas").addEventListener("click",()=>document.getElementById("glcanvas").focus());
    window.addEventListener("load",()=>setTimeout(()=>{document.getElementById("loading").style.display="none"},1800));
  </script>
</body>
</html>
