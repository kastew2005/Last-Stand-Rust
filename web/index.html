<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101612">
  <meta name="description" content="LAST STAND: Zombie Apocalypse — мобильная игра на Rust.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAST STAND">
  <meta name="application-name" content="LAST STAND">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>LAST STAND — Zombie Apocalypse</title>
  <style>
    :root{color-scheme:dark;--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#101612;color:#e8e8dc;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
    body{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#101612;z-index:5;padding:24px}
    #loading h1{letter-spacing:.14em;font-size:clamp(24px,5vw,48px);margin:0;color:#d8d6bd}
    #loading p{color:#a6aa9b;max-width:320px;line-height:1.5}
    #bar{height:4px;background:#353d33;margin:18px auto;width:min(260px,70vw);overflow:hidden}
    #bar:after{content:"";display:block;height:100%;width:35%;background:#b5a36b;animation:load 1.2s infinite ease-in-out}
    @keyframes load{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
    #install{position:fixed;z-index:4;top:calc(var(--safe-top) + 10px);right:12px;border:1px solid #9f956c;border-radius:22px;padding:10px 14px;background:#202a22;color:#f4edcf;font-weight:700;font-size:13px;box-shadow:0 4px 18px #0008;touch-action:manipulation}
    #hint{position:fixed;z-index:4;left:12px;top:calc(var(--safe-top) + 12px);font-size:11px;color:#c3c5b6;background:#101612aa;padding:8px 10px;border-radius:10px;pointer-events:none}
    #install-help{display:none;position:fixed;z-index:8;inset:0;background:#000b;align-items:center;justify-content:center;padding:22px}
    #install-help article{max-width:360px;background:#1b241d;border:1px solid #8f875e;border-radius:18px;padding:22px;line-height:1.5}
    #install-help button{width:100%;padding:12px;border:0;border-radius:10px;background:#b6a36a;color:#151811;font-weight:800;margin-top:12px}
    @media(orientation:landscape) and (max-height:500px){#hint{display:none}#install{padding:7px 11px;font-size:11px}}
  </style>
</head>
<body>
  <div id="loading"><h1>LAST STAND</h1><p id="loading-message">Проверка игровых файлов…</p><div id="bar"></div></div>
  <div id="hint">ЛУЧШЕ В АЛЬБОМНОЙ ОРИЕНТАЦИИ · TOUCH</div>
  <button id="install" type="button">＋ УСТАНОВИТЬ</button>
  <div id="install-help"><article><h2>Установка LAST STAND</h2><p id="install-text"></p><button id="close-help">ПОНЯТНО</button></article></div>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="./mq_js_bundle.js"></script>
  <script>
    const canvas=document.getElementById('glcanvas');
    const loading=document.getElementById('loading');
    const loadingMessage=document.getElementById('loading-message');
    const installBtn=document.getElementById('install');
    const help=document.getElementById('install-help');
    const helpText=document.getElementById('install-text');
    let deferredPrompt=null;
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    if(isStandalone) installBtn.style.display='none';

    function fatal(message){
      document.getElementById('bar').style.display='none';
      loadingMessage.textContent=message;
      const retry=document.createElement('button');
      retry.textContent='ПОВТОРИТЬ ЗАПУСК';
      retry.style.cssText='margin:18px auto 0;padding:13px 18px;border:1px solid #b6a36a;border-radius:10px;background:#303b30;color:#fff;font-weight:800';
      retry.onclick=()=>location.reload();
      loading.appendChild(retry);
    }

    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;});
    installBtn.addEventListener('click',async()=>{
      if(isStandalone)return;
      if(deferredPrompt){
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt=null;
      }else{
        helpText.textContent=isIOS
          ? 'В Safari нажми «Поделиться» (квадрат со стрелкой вверх), прокрути меню и выбери «На экран Домой» → «Добавить».'
          : 'Открой меню браузера (⋮ или Поделиться) и выбери «Установить приложение» или «Добавить на главный экран».';
        help.style.display='flex';
      }
    });
    document.getElementById('close-help').addEventListener('click',()=>help.style.display='none');
    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

    async function boot(){
      try{
        if(typeof load!=='function') throw new Error('Не загрузился игровой JavaScript-файл mq_js_bundle.js');
        loadingMessage.textContent='Загрузка 3D-движка и игрового мира…';
        const response=await fetch('./last_stand_rust.wasm',{cache:'no-store'});
        if(!response.ok) throw new Error('Не найден WASM-файл игры: HTTP '+response.status);
        const bytes=await response.arrayBuffer();
        await WebAssembly.compile(bytes);
        load('./last_stand_rust.wasm');
        setTimeout(()=>{loading.style.display='none';canvas.focus();},900);
      }catch(error){
        console.error('LAST STAND startup error:',error);
        fatal('Не удалось запустить игру. '+(error&&error.message?error.message:String(error))+' Проверь подключение и обнови страницу.');
      }
    }

    let bootStarted=false;
    function startApp(){
      if(bootStarted)return;
      bootStarted=true;
      if('serviceWorker' in navigator && location.protocol!=='file:'){
        navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline cache unavailable:',err));
      }
      boot();
    }
    // Запускаем игру сразу после разбора HTML, не ожидая полной загрузки всех ресурсов.
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',startApp,{once:true});
    }else{
      startApp();
    }
    // Запасной запуск для мобильных Safari, если событие готовности задержалось.
    setTimeout(startApp,1500);
  </script>
</body>
</html>
