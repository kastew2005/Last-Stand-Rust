name: Build and deploy WebAssembly game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build game
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp web/index.html dist/index.html
          cp web/mq_js_bundle.js dist/mq_js_bundle.js
          cp web/manifest.webmanifest dist/manifest.webmanifest
          cp web/sw.js dist/sw.js
          mkdir -p dist/icons
          cp web/icons/icon.svg dist/icons/icon.svg
          cp target/wasm32-unknown-unknown/release/last_stand_rust.wasm dist/last_stand_rust.wasm
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
